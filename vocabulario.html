<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocabulario – flashcards y quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8; --ink:#14213D; --muted:#56637d; --tile:#1D4E9E; --tile-2:#F2B632;
  --card:#FFFFFF; --ok:#2E7D4F; --bad:#B3382C; --line:#c9d3e6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1830; --ink:#E8EDF7; --muted:#9aa8c4; --tile:#5B8FE0; --tile-2:#F2B632;
    --card:#18244a; --ok:#5fc48a; --bad:#ef7b6f; --line:#2c3a66;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1830; --ink:#E8EDF7; --muted:#9aa8c4; --tile:#5B8FE0; --tile-2:#F2B632;
  --card:#18244a; --ok:#5fc48a; --bad:#ef7b6f; --line:#2c3a66;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Karla,system-ui,sans-serif;}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:Alegreya,Georgia,serif;font-size:1.9rem;line-height:1.15;margin:4px 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1.5px solid var(--tile);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--tile);padding:10px 4px;font:600 .88rem Karla,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--tile);color:#fff}
.pick{display:block;margin-bottom:10px}.pick span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
#setpick{width:100%;min-height:46px;border-radius:10px;border:1.5px solid var(--tile);background:var(--card);color:var(--ink);font:600 1rem Karla,sans-serif;padding:8px 10px}
.meta{color:var(--muted);font-size:.9rem;margin:6px 0 14px;display:flex;justify-content:space-between}
/* the tile card */
.tile{position:relative;background:var(--card);border-radius:18px;padding:14px;min-height:300px;
  border:10px solid transparent;
  background-image:linear-gradient(var(--card),var(--card)),
   repeating-conic-gradient(var(--tile) 0 25%, var(--tile-2) 0 50%);
  background-origin:border-box;background-clip:padding-box,border-box;background-size:auto,18px 18px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.word{font-family:Alegreya,Georgia,serif;font-size:2.3rem;font-weight:700;line-height:1.15}
.mean{font-size:1.4rem;font-weight:600;color:var(--tile);margin-top:4px}
.note{color:var(--muted);font-size:.95rem;margin-top:10px;max-width:34ch}
.hint{color:var(--muted);font-size:.85rem;margin-top:18px}
.btn{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 1rem Karla,sans-serif;cursor:pointer}
.btn.primary{background:var(--tile);border-color:var(--tile);color:#fff}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.again{border-color:var(--bad);color:var(--bad)}
.actions{margin-top:14px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;padding:12px 14px}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
button:focus-visible{outline:3px solid var(--tile-2);outline-offset:2px}
.done{text-align:center}
.sent{font-family:Alegreya,Georgia,serif;font-size:1.45rem;line-height:1.35}
.blank{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--tile);color:var(--tile);font-weight:700}
.trans{color:var(--muted);font-size:.95rem;margin-top:10px}
.verdict{font-weight:700;margin-top:10px}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.answer{width:100%;min-height:50px;margin-top:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:1.1rem Karla,sans-serif;padding:10px 14px}
.answer:focus{outline:3px solid var(--tile-2);outline-offset:1px}
.done .word{font-size:3rem}
</style>
</head>
<body>

    <button data-mode="cards">Flashcards</button>

    <button data-mode="write">Sentences</button>
    <button data-mode="type">EN → ES</button>

                 : `<div class="hint" id="hintline"></div>`}
    </div>
    ${answered ? `<div class="row actions"><button class="btn primary" id="nx">Next word</button></div>`
      : `<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type it in Spanish">
         <div class="row actions"><button class="btn" id="hint">Hint</button><button class="btn primary" id="check">Check</button></div>`}`;
    if(answered){ $("#nx").onclick=next; setTimeout(()=>{ document.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); next(); } }; },0); return; }
    const inp=$("#ans"); inp.focus();
    // accept this word or any word in the set with the same meaning (e.g. infancia / niñez)
    const deck=SETS[state.set];
    const ok=[...new Set(deck.filter(x=>x.m===c.m).flatMap(x=>forms(x.w)))];
    const check=()=>{
      const v=normA(inp.value); if(!v) return;
      if(ok.includes(v)){ score++; answered={ok:true,msg:"¡Correcto! "+esc(c.w)}; }
      else if(ok.some(a=>strip(a)===strip(v))){ score++; answered={ok:true,msg:"Correct, but check the accent: "+esc(c.w)}; }
      else answered={ok:false,msg:"You wrote “"+esc(inp.value.trim())+"”. The answer is "+esc(c.w)+"."};
      render();
    };
    $("#check").onclick=check;
    inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
    let hints=0; const first=forms(c.w)[0];
    $("#hint").onclick=()=>{ hints++;
      $("#hintline").textContent = hints===1 ? first.length+" letters, starts with “"+first[0]+"”" : "Starts with “"+first.slice(0,3)+"…”";
      inp.focus(); };
  } else if(state.mode==="write"){
    $("#score").textContent = `Score: ${score}`;
    const s = SENT[c.w];
    const filled = answered ? `<span class="blank">${esc(s.a[0])}</span>` : `<span class="blank">&nbsp;</span>`;
    stage.innerHTML = `<div class="tile" style="min-height:220px;cursor:default">
      <div class="sent">${esc(s.s).replace("___", filled)}</div>
      ${answered ? `<div class="verdict ${answered.ok?"ok":"bad"}">${answered.msg}</div><div class="trans">${esc(s.en)}</div>`
                 : `<div class="hint" id="hintline"></div>`}
    </div>
    ${answered ? `<div class="row actions"><button class="btn primary" id="nx">Next sentence</button></div>`
      : `<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the missing word">
         <div class="row actions"><button class="btn" id="hint">Hint</button><button class="btn primary" id="check">Check</button></div>`}`;
    if(answered){ $("#nx").onclick=next; setTimeout(()=>{ document.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); next(); } }; },0); return; }
    const inp=$("#ans"); inp.focus();
    const strip=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const norm=x=>x.toLowerCase().trim().replace(/\s+/g," ").replace(/^(el|la|los|las|un|una) /,"");
    const check=()=>{
      const v=norm(inp.value); if(!v) return;
      const exact=s.a.some(a=>norm(a)===v);
      const loose=!exact && s.a.some(a=>strip(norm(a))===strip(v));
      if(exact){ score++; answered={ok:true,msg:"¡Correcto!"}; }
      else if(loose){ score++; answered={ok:true,msg:"Correct, but check the accent: "+esc(s.a[0])}; }
      else answered={ok:false,msg:"You wrote “"+esc(inp.value.trim())+"”. The answer is "+esc(s.a[0])+" ("+esc(c.m)+")."};
      render();
    };
    $("#check").onclick=check;
    inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
    let hints=0;
    $("#hint").onclick=()=>{ hints++; $("#hintline").textContent = hints===1 ? "Meaning: "+c.m : "Starts with “"+s.a[0].slice(0,2)+"…”"; inp.focus(); };
  } else {
    $("#score").textContent = `Score: ${score}`;
    if(!answered){
      const others = shuffle(deck.filter(x=>x.m!==c.m)).slice(0,3).map(x=>x.m);
      opts = shuffle([c.m,...others]);
    }
    stage.innerHTML = `<div class="tile" style="min-height:200px;cursor:default">
      <div class="word">${esc(c.w)}</div>
      ${answered && c.n ? `<div class="note">${esc(c.n)}</div>`:""}
    </div>
    <div class="opts">${opts.map((o,i)=>{
      let cls="btn opt";
      if(answered){ if(o===c.m) cls+=" right"; else if(o===answered) cls+=" wrong"; }
      return `<button class="${cls}" data-i="${i}" ${answered?"disabled":""}>${esc(o)}</button>`;
    }).join("")}</div>
    ${answered?`<div class="row actions"><button class="btn primary" id="nx">Next word</button></div>`:""}`;
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      answered = opts[+b.dataset.i]; if(answered===c.m) score++; render();
    });
    const nx=$("#nx"); if(nx) nx.onclick=next;
  }
}
function next(){ document.onkeydown=null; idx++; flipped=false; answered=false; render(); }

document.getElementById("setpick").onchange=e=>{state.set=e.target.value;store.set("set",state.set);start();};
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;store.set("mode",state.mode);start();});
start();
</script>
</body>
</html>
