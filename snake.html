<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Serpiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8; --ink:#14213D; --muted:#56637d; --tile:#1D4E9E; --tile-2:#F2B632;
  --card:#FFFFFF; --ok:#2E7D4F; --bad:#B3382C; --line:#c9d3e6; --grid:#f3f6fb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1830; --ink:#E8EDF7; --muted:#9aa8c4; --tile:#5B8FE0; --tile-2:#F2B632;
    --card:#18244a; --ok:#5fc48a; --bad:#ef7b6f; --line:#2c3a66; --grid:#1b2852;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1830; --ink:#E8EDF7; --muted:#9aa8c4; --tile:#5B8FE0; --tile-2:#F2B632;
  --card:#18244a; --ok:#5fc48a; --bad:#ef7b6f; --line:#2c3a66; --grid:#1b2852;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Karla,system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-family:Alegreya,Georgia,serif;font-size:1.9rem;line-height:1.15;margin:4px 0 12px}
.meta{color:var(--muted);font-size:.95rem;margin:0 0 10px;display:flex;justify-content:space-between}
.meta b{color:var(--ink)}
.board{position:relative;border-radius:18px;border:10px solid transparent;
  background-image:linear-gradient(var(--card),var(--card)),
   repeating-conic-gradient(var(--tile) 0 25%, var(--tile-2) 0 50%);
  background-origin:border-box;background-clip:padding-box,border-box;background-size:auto,18px 18px;
  touch-action:none;user-select:none}
canvas{display:block;width:100%;aspect-ratio:1/1;border-radius:8px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:6px;padding:16px;background:color-mix(in srgb,var(--card) 82%,transparent);border-radius:8px}
.overlay[hidden]{display:none}
.overlay h2{font-family:Alegreya,Georgia,serif;font-size:1.7rem;margin:0}
.overlay p{margin:0;color:var(--muted)}
.btn{border:0;border-radius:10px;background:var(--tile);color:#fff;font:600 1rem Karla,sans-serif;
  padding:12px 22px;cursor:pointer;margin-top:8px}
.row{display:flex;gap:8px;margin-top:12px}
.row .btn{flex:1;margin:0;background:transparent;color:var(--tile);border:1.5px solid var(--tile)}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;
  justify-content:center;margin-top:14px}
.pad button{border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
  font-size:1.4rem;cursor:pointer;touch-action:manipulation}
.pad button:active{background:var(--tile);color:#fff}
.pad .up{grid-column:2}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin-top:12px}
@media (hover:hover) and (pointer:fine){ .pad{display:none} }
</style>
</head>
<body>
<main>
  <h1>Serpiente</h1>
  <div class="meta">
    <span>Puntos: <b id="score">0</b></span>
    <span>Récord: <b id="best">0</b></span>
  </div>

  <div class="board" id="board">
    <canvas id="c" width="400" height="400" aria-label="Tablero de la serpiente"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">¿Listo?</h2>
      <p id="ovText">Come las frutas y no choques contigo.</p>
      <button class="btn" id="startBtn">Empezar</button>
    </div>
  </div>

  <div class="row">
    <button class="btn" id="pauseBtn">Pausa</button>
    <button class="btn" id="wallBtn" aria-pressed="false">Paredes: no</button>
  </div>

  <div class="pad" aria-label="Controles">
    <button class="up" data-dir="up" aria-label="Arriba">▲</button>
    <button data-dir="left" aria-label="Izquierda">◀</button>
    <button data-dir="down" aria-label="Abajo">▼</button>
    <button data-dir="right" aria-label="Derecha">▶</button>
  </div>

  <p class="hint">Flechas / WASD para moverte · Espacio para pausar · Desliza en el móvil</p>
</main>

<script>
(() => {
  const N = 20;                       // cells per side
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best');
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText'), startBtn = $('startBtn');
  const pauseBtn = $('pauseBtn'), wallBtn = $('wallBtn');

  const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
  const FRUITS = ['🍎','🍊','🍋','🍇','🍓','🍒','🍐','🍉'];

  let snake, dir, queue, food, score, running, paused, timer, walls = false;
  let best = 0;
  try { best = +localStorage.getItem('snake-best') || 0; } catch {}
  bestEl.textContent = best;

  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function reset() {
    const m = N >> 1;
    snake = [[m, m], [m - 1, m], [m - 2, m]];
    dir = 'right'; queue = [];
    score = 0; scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++)
      if (!snake.some(([sx, sy]) => sx === x && sy === y)) free.push([x, y]);
    const [x, y] = free[Math.floor(Math.random() * free.length)];
    food = { x, y, icon: FRUITS[Math.floor(Math.random() * FRUITS.length)] };
  }

  const speed = () => Math.max(60, 150 - score * 3);   // ms per step, speeds up as you eat

  function turn(d) {
    const last = queue.length ? queue[queue.length - 1] : dir;
    const [lx, ly] = DIRS[last], [nx, ny] = DIRS[d];
    if (lx + nx === 0 && ly + ny === 0) return;      // no 180° turns
    if (d === last || queue.length >= 2) return;
    queue.push(d);
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const [dx, dy] = DIRS[dir];
    let [hx, hy] = snake[0];
    hx += dx; hy += dy;

    if (walls) {
      if (hx < 0 || hy < 0 || hx >= N || hy >= N) return gameOver();
    } else {
      hx = (hx + N) % N; hy = (hy + N) % N;
    }

    const eating = hx === food.x && hy === food.y;
    // the tail moves away this step unless we're growing, so it's safe to enter
    const body = eating ? snake : snake.slice(0, -1);
    if (body.some(([x, y]) => x === hx && y === hy)) return gameOver();

    snake.unshift([hx, hy]);
    if (eating) {
      score++; scoreEl.textContent = score;
      if (snake.length === N * N) return gameOver(true);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
    timer = setTimeout(step, speed());
  }

  function draw() {
    const s = canvas.width / N;
    ctx.fillStyle = css('--card');
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = css('--grid');
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++)
      if ((x + y) % 2) ctx.fillRect(x * s, y * s, s, s);

    ctx.font = `${s * 0.85}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(food.icon, food.x * s + s / 2, food.y * s + s / 2 + 1);

    const body = css('--tile'), head = css('--ok');
    snake.forEach(([x, y], i) => {
      ctx.fillStyle = i === 0 ? head : body;
      ctx.globalAlpha = i === 0 ? 1 : Math.max(0.55, 1 - i / (snake.length * 1.6));
      roundRect(x * s + 1, y * s + 1, s - 2, s - 2, s * 0.3);
    });
    ctx.globalAlpha = 1;

    // eyes
    const [hx, hy] = snake[0], [dx, dy] = DIRS[dir];
    ctx.fillStyle = '#fff';
    const cx = hx * s + s / 2, cy = hy * s + s / 2, o = s * 0.2;
    [[-1], [1]].forEach(([k]) => {
      ctx.beginPath();
      ctx.arc(cx + dx * o + dy * o * k, cy + dy * o + dx * o * k, s * 0.1, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.fill();
  }

  function start() {
    clearTimeout(timer);
    reset();
    running = true; paused = false;
    pauseBtn.textContent = 'Pausa';
    overlay.hidden = true;
    draw();
    timer = setTimeout(step, speed());
  }

  function gameOver(won) {
    running = false;
    clearTimeout(timer);
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch {}
    }
    draw();
    showOverlay(won ? '¡Ganaste!' : '¡Fin del juego!', `Puntos: ${score}`, 'Otra vez');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? 'Seguir' : 'Pausa';
    if (paused) {
      clearTimeout(timer);
      showOverlay('Pausa', 'Pulsa espacio para seguir.', 'Seguir');
    } else {
      overlay.hidden = true;
      timer = setTimeout(step, speed());
    }
  }

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title; ovText.textContent = text; startBtn.textContent = btn;
    overlay.hidden = false;
  }

  startBtn.addEventListener('click', () => (running && paused) ? togglePause() : start());
  pauseBtn.addEventListener('click', togglePause);
  wallBtn.addEventListener('click', () => {
    walls = !walls;
    wallBtn.setAttribute('aria-pressed', walls);
    wallBtn.textContent = 'Paredes: ' + (walls ? 'sí' : 'no');
    wallBtn.blur();
  });

  const KEYS = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right'
  };
  document.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!running) start(); else togglePause();
      return;
    }
    const d = KEYS[e.key];
    if (d) { e.preventDefault(); if (running && !paused) turn(d); }
  });

  document.querySelectorAll('.pad button').forEach(b =>
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!running) return start();
      if (!paused) turn(b.dataset.dir);
    }));

  // swipe on the board
  let t0 = null;
  const board = $('board');
  board.addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive: true });
  board.addEventListener('touchend', e => {
    if (!t0 || !running || paused) return;
    const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    t0 = null;
  });

  // redraw when the colour scheme changes
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => snake && draw());

  reset();
  draw();
})();
</script>
</body>
</html>
